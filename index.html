<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مغامرة الكتاب المفقود - المكتبة الرئيسية لولاية غليزان</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.95);
            --gold: #f59e0b;
            --gold-light: #fbbf24;
            --emerald: #10b981;
            --ruby: #ef4444;
            --text-light: #f8fafc;
            --text-sub: #94a3b8;
            --accent-blue: #38bdf8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            user-select: none;
        }

        body {
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            position: relative;
            overflow-x: hidden;
        }

        /* Watermark SM/1628 Fixed */
        .permanent-watermark {
            position: fixed;
            bottom: 15px;
            left: 15px;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(245, 158, 11, 0.6);
            color: var(--gold);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 800;
            letter-spacing: 1px;
            z-index: 9999;
            pointer-events: none;
            backdrop-filter: blur(5px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            border: 2px solid rgba(245, 158, 11, 0.4);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.7);
            backdrop-filter: blur(10px);
            position: relative;
            margin-bottom: 40px;
        }

        .header {
            text-align: center;
            border-bottom: 2px solid rgba(255,255,255,0.1);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .header h1 {
            color: var(--gold);
            font-size: 1.8rem;
            font-weight: 900;
            text-shadow: 0 2px 10px rgba(245, 158, 11, 0.3);
        }

        .header p {
            color: var(--text-sub);
            font-size: 0.95rem;
            margin-top: 5px;
        }

        /* Stats Bar */
        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(15, 23, 42, 0.7);
            padding: 12px 18px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.08);
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.95rem;
            font-weight: 700;
        }

        .progress-bar-container {
            width: 100%;
            height: 8px;
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--gold), var(--emerald));
            transition: width 0.4s ease;
        }

        /* Setup Screen */
        .setup-screen {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-group label {
            font-weight: 700;
            color: var(--accent-blue);
        }

        .input-group input {
            padding: 14px;
            border-radius: 10px;
            border: 2px solid rgba(255,255,255,0.15);
            background: rgba(15, 23, 42, 0.9);
            color: #fff;
            font-size: 1.05rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            border-color: var(--gold);
            box-shadow: 0 0 10px rgba(245, 158, 11, 0.3);
        }

        .type-selector {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
        }

        .type-btn {
            background: rgba(15, 23, 42, 0.8);
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 15px 10px;
            color: #fff;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .type-btn:hover, .type-btn.selected {
            border-color: var(--gold);
            background: rgba(245, 158, 11, 0.2);
            transform: translateY(-2px);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--gold), #d97706);
            color: #0f172a;
            border: none;
            padding: 15px;
            border-radius: 12px;
            font-size: 1.15rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(245, 158, 11, 0.4);
            margin-top: 10px;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(245, 158, 11, 0.6);
        }

        /* Question Screen */
        .question-card {
            background: rgba(15, 23, 42, 0.6);
            border-radius: 15px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.08);
            margin-bottom: 20px;
        }

        .scenario-text {
            font-size: 1rem;
            color: var(--gold-light);
            margin-bottom: 15px;
            line-height: 1.6;
            background: rgba(245, 158, 11, 0.1);
            padding: 12px;
            border-right: 4px solid var(--gold);
            border-radius: 6px;
        }

        .question-text {
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
        }

        .option-btn {
            background: rgba(30, 41, 59, 0.95);
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 14px 18px;
            color: #fff;
            font-size: 1rem;
            text-align: right;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .option-btn:hover:not(:disabled) {
            border-color: var(--accent-blue);
            background: rgba(56, 189, 248, 0.15);
        }

        .option-btn.correct {
            border-color: var(--emerald) !important;
            background: rgba(16, 185, 129, 0.25) !important;
            color: #6ee7b7;
        }

        .option-btn.wrong {
            border-color: var(--ruby) !important;
            background: rgba(239, 68, 68, 0.25) !important;
            color: #fca5a5;
        }

        .feedback-box {
            margin-top: 15px;
            padding: 14px;
            border-radius: 12px;
            font-weight: 600;
            display: none;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .feedback-box.correct {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid var(--emerald);
            color: #6ee7b7;
        }

        .feedback-box.wrong {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid var(--ruby);
            color: #fca5a5;
        }

        /* Certificate Screen */
        .certificate-container {
            background: #fff;
            color: #1e293b;
            padding: 25px;
            border-radius: 15px;
            border: 8px double #d97706;
            text-align: center;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .cert-header {
            margin-bottom: 15px;
            border-bottom: 2px solid #d97706;
            padding-bottom: 10px;
        }

        .cert-header h2 {
            font-size: 1.1rem;
            color: #1e293b;
            font-weight: 800;
        }

        .cert-header h3 {
            font-size: 1rem;
            color: #d97706;
            font-weight: 700;
            margin-top: 3px;
        }

        .cert-header h4 {
            font-size: 0.9rem;
            color: #475569;
            font-weight: 600;
        }

        .cert-title {
            font-size: 1.8rem;
            color: #b45309;
            font-weight: 900;
            margin: 10px 0;
            text-decoration: underline;
        }

        .cert-body {
            font-size: 1.1rem;
            line-height: 1.8;
            margin: 15px 0;
            color: #334155;
        }

        .cert-name {
            font-size: 1.8rem;
            color: #0f172a;
            font-weight: 900;
            border-bottom: 2px dashed #cbd5e1;
            display: inline-block;
            padding: 0 15px;
            margin: 5px 0;
        }

        .cert-badge {
            background: linear-gradient(135deg, #f59e0b, #b45309);
            color: #fff;
            padding: 8px 20px;
            border-radius: 50px;
            display: inline-block
